<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página con Python y HTML</title>
    
    <!-- 1. Vinculamos PyScript para que el navegador entienda Python -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>Esta es una etiqueta HTML normal</h1>
    <p>Abajo verás el resultado de un código ejecutado en Python:</p>

    <!-- 2. Aquí pegas tu código Python tal cual -->
    <script type="py">
        from datetime import datetime

        print("¡Hola! Este mensaje viene directo de Python.")
        print(f"La fecha y hora actual es: {datetime.now()}")
    </script>

</body>
</html>
